name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omniconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/omniconnect?schema=public
      NEXTAUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379
      RATE_LIMIT_IP_HEADER: fly-client-ip
      EMAIL_PROVIDER: smtp
      SMTP_HOST: localhost
      SMTP_PORT: 587
      SMTP_USER: ci@example.com
      SMTP_FROM: ci@example.com
      META_APP_ID: ci-test
      RAZORPAY_KEY_ID: ci_test_key
      RAZORPAY_PLAN_PRO: plan_ci_pro
      RAZORPAY_PLAN_BUSINESS: plan_ci_business
      SUPER_ADMIN_EMAIL: admin@example.com

    steps:
      - uses: actions/checkout@v4

      - name: Generate CI test secrets
        run: |
          # Generates a secret, masks it from all subsequent logs, and exports it
          # for later steps. Values are never committed.
          secret_env() {
            local name=$1
            local value=$2
            echo "::add-mask::$value"
            echo "$name=$value" >> $GITHUB_ENV
          }

          secret_env NEXTAUTH_SECRET "$(openssl rand -hex 32)"
          secret_env ENCRYPTION_KEY "$(openssl rand -hex 32)"
          secret_env OPENROUTER_API_KEY "sk-or-v1-$(openssl rand -hex 32)"
          secret_env META_APP_SECRET "$(openssl rand -hex 32)"
          secret_env META_WEBHOOK_VERIFY_TOKEN "$(openssl rand -hex 32)"
          secret_env RAZORPAY_KEY_SECRET "$(openssl rand -hex 32)"
          secret_env RAZORPAY_WEBHOOK_SECRET "$(openssl rand -hex 32)"
          secret_env SHOPIFY_API_KEY "ci-placeholder-key-$(openssl rand -hex 16)"
          secret_env SHOPIFY_API_SECRET "$(openssl rand -hex 32)"
          secret_env SUPER_ADMIN_PASSWORD "$(openssl rand -hex 32)"
          secret_env SMTP_PASSWORD "$(openssl rand -hex 32)"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Migration dry-run (apply all migrations)
        run: npx prisma migrate deploy

      - name: Run integration tests
        run: npm run test:integration

      - name: Build Next.js app
        run: npm run build

      - name: Build worker bundle
        run: npm run build:worker

      - name: Smoke test
        run: |
          set -e
          node .next/standalone/server.js &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT

          # Use the IPv4 loopback to avoid any IPv6 / localhost resolution surprises in CI.
          BASE=http://127.0.0.1:3000
          ok=0
          for i in {1..30}; do
            if curl -4sf --max-time 5 "$BASE/api/health" > /dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo "health failed" >&2; exit 1; fi

          check() {
            local label=$1
            shift
            local body_file
            body_file=$(mktemp)
            code=$(curl -4sS --max-time 10 -o "$body_file" -w '%{http_code}' "$@")
            echo "$label -> $code" >&2
            if [ "$code" != "200" ]; then
              echo "$label body:" >&2
              cat "$body_file" >&2 || true
            fi
            rm -f "$body_file"
            echo "$code"
          }

          health=$(check health "$BASE/api/health")
          [ "$health" = "200" ] || { echo "health not 200" >&2; exit 1; }

          # C1 regression: auth must not 500 with UntrustedHost behind a proxy-less host.
          auth=$(check auth "$BASE/api/auth/session")
          [ "$auth" = "200" ] || { echo "auth not 200" >&2; exit 1; }

          ready=$(check ready "$BASE/api/ready")
          [ "$ready" = "200" ] || { echo "ready not 200" >&2; exit 1; }

          # H9 regression: the Shopify webhook must reach HMAC verification, not redirect.
          shopify=$(curl -4sS --max-time 10 -o /dev/null -w '%{http_code}' -X POST "$BASE/api/shopify/webhooks")
          echo "shopify -> $shopify" >&2
          case "$shopify" in 3*) echo "shopify webhook redirected ($shopify)" >&2; exit 1;; esac

          # M7 regression: store and admin routes must emit the right HTTP status before streaming.
          BASE_URL="$BASE" npx tsx scripts/check-http-status.ts

  container-scan:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t omniconnect-ai:ci .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "omniconnect-ai:ci"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
