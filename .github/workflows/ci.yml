name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omniconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/omniconnect?schema=public
      NEXTAUTH_SECRET: ci-test-secret
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Migration dry-run (apply all migrations)
        run: npx prisma migrate deploy

      - name: Build Next.js app
        run: npm run build

      - name: Build worker bundle
        run: npm run build:worker

      - name: Smoke test
        run: |
          npm start &
          APP_PID=$!
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/health; then
              echo "Smoke test passed"
              kill $APP_PID || true
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test failed"
          kill $APP_PID || true
          exit 1
